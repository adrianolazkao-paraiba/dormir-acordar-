<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Minha conta – SuperSportBrazil</title>
<link rel="icon" href="/assets/logo.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/assets/site.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="/assets/auth.js"></script>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" href="/"><img src="/assets/logo.png" alt=""><b>SuperSport<span>Brazil</span></b></a>
    <nav class="links"><button class="btn" id="sair" type="button">Sair</button></nav>
  </header>
  <div class="box">
    <h2>Minha conta</h2>
    <p class="small" id="quem">Carregando…</p>
    <div><span class="status" id="status">…</span></div>
    <p class="small" id="detalhe"></p>
    <a class="btn red" id="abrir" href="/app/" hidden>Abrir o Cortador</a>
    <button class="btn red" id="assinar" type="button" hidden>Assinar – 7 dias grátis</button>
    <a class="btn" id="gerenciar" href="https://www.mercadopago.com.br/subscriptions" target="_blank" rel="noopener" hidden>Gerenciar ou cancelar no Mercado Pago</a>
    <p class="msg" id="msg" role="status"></p>
  </div>
  <form class="box" id="novaSenha" hidden>
    <h3>Criar nova senha</h3>
    <label>Nova senha<input id="senha1" type="password" minlength="8" autocomplete="new-password"></label>
    <button class="btn navy" type="submit">Salvar senha</button>
    <p class="msg" id="msg2"></p>
  </form>
</div>
<script>
const $=id=>document.getElementById(id);
const brl=v=>'R$ '+Number(v).toFixed(2).replace('.',',');
const data=s=>s?new Date(s).toLocaleDateString('pt-BR'):'';
function msg(t,ok){ const m=$('msg'); m.textContent=t; m.className='msg '+(t?(ok?'ok':'err'):''); }
async function carregar(){
  const s=await SSB.requireLogin(); if(!s) return;
  $('quem').textContent='Conectado como '+s.user.email;
  if(new URLSearchParams(location.search).get('senha')==='nova') $('novaSenha').hidden=false;
  try{
    const st=await SSB.api('/api/status');
    const on=st.active;
    $('status').textContent=on?'Assinatura ativa':(st.status==='pending'?'Pagamento em análise':'Sem assinatura ativa');
    $('status').className='status '+(on?'on':'off');
    $('detalhe').textContent=on?(st.nextPaymentDate?'Próxima cobrança: '+data(st.nextPaymentDate)+'.':''):
      'Assine para usar o Cortador. Você tem 7 dias grátis e depois paga '+brl(st.price)+' por mês.';
    $('abrir').hidden=!on; $('assinar').hidden=on; $('gerenciar').hidden=!st.status;
  }catch(e){ msg(e.message); }
}
$('assinar').onclick=async()=>{
  $('assinar').disabled=true; msg('Abrindo o Mercado Pago…',true);
  try{ const r=await SSB.api('/api/assinar',{method:'POST',body:'{}'}); location.href=r.url; }
  catch(e){ msg(e.message); $('assinar').disabled=false; }
};
$('sair').onclick=async()=>{ const sb=await SSB.client(); await sb.auth.signOut(); location.href='/'; };
$('novaSenha').addEventListener('submit',async e=>{ e.preventDefault(); const p=$('senha1').value;
  if(p.length<8){ $('msg2').textContent='Use pelo menos 8 caracteres.'; return; }
  const sb=await SSB.client(); const {error}=await sb.auth.updateUser({password:p});
  $('msg2').textContent=error?error.message:'Senha alterada.'; $('msg2').className='msg '+(error?'err':'ok'); });
// Voltando do Mercado Pago a confirmação pode levar alguns segundos: confere de novo
if(new URLSearchParams(location.search).get('pago')) setTimeout(carregar,6000);
carregar();
</script>
</body>
</html>
